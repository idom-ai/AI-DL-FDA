[project]
name = "tfg-investigacion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scikit-fda>=0.10.1",
    "scipy>=1.17.1",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_matching", "flow_matching_fda"]

[tool.uv]
# multimethod 2.1 breaks scikit-fda 0.10.1 on import (upstream excludes it too)
constraint-dependencies = ["multimethod!=2.1"]
